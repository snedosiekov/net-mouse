<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img"
     aria-label="One mouse and keyboard on the master PC also control two other PCs on the same network">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B97EE"/><stop offset="1" stop-color="#2654A8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4CCB92"/><stop offset="1" stop-color="#1A7C54"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF8C00"/>
    </marker>
  </defs>

  <rect width="940" height="450" fill="#ffffff"/>

  <text x="470" y="40" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="16" font-weight="600" fill="#2E3542">The pointer leaves one screen and continues on the next PC</text>

  <!-- master PC -->
  <g>
    <rect x="46" y="74" width="276" height="178" rx="14" fill="#161A20" opacity="0.18"/>
    <rect x="42" y="70" width="276" height="178" rx="14" fill="#22262E"/>
    <rect x="50" y="78" width="260" height="162" rx="9" fill="url(#blue)"/>
    <rect x="50" y="78" width="260" height="72" rx="9" fill="url(#gloss)"/>
    <text x="180" y="152" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif"
          font-size="22" font-weight="600" fill="#ffffff">MASTER</text>
    <text x="180" y="178" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif"
          font-size="14" fill="#E6EEFB">your mouse and keyboard</text>
    <rect x="160" y="248" width="40" height="16" fill="#22262E"/>
    <rect x="130" y="264" width="100" height="9" rx="4.5" fill="#22262E"/>
    <text x="180" y="296" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif"
          font-size="13.5" font-weight="600" fill="#2E3542">STUDIO-PC · Windows</text>
    <!-- keyboard -->
    <rect x="76" y="314" width="128" height="46" rx="7" fill="#E8ECF3" stroke="#C3CBD8"/>
    <g fill="#AFB9C9">
      <rect x="84" y="322" width="14" height="9" rx="2"/><rect x="102" y="322" width="14" height="9" rx="2"/>
      <rect x="120" y="322" width="14" height="9" rx="2"/><rect x="138" y="322" width="14" height="9" rx="2"/>
      <rect x="156" y="322" width="14" height="9" rx="2"/><rect x="174" y="322" width="22" height="9" rx="2"/>
      <rect x="84" y="335" width="20" height="9" rx="2"/><rect x="108" y="335" width="14" height="9" rx="2"/>
      <rect x="126" y="335" width="14" height="9" rx="2"/><rect x="144" y="335" width="14" height="9" rx="2"/>
      <rect x="162" y="335" width="34" height="9" rx="2"/>
      <rect x="100" y="348" width="80" height="8" rx="2"/>
    </g>
    <!-- mouse -->
    <g transform="translate(222 312)">
      <path d="M20,0 a20,20 0 0 1 20,20 v16 a20,20 0 0 1 -40,0 v-16 a20,20 0 0 1 20,-20 z"
            fill="#E8ECF3" stroke="#C3CBD8"/>
      <path d="M20,0 v16" stroke="#C3CBD8" fill="none"/>
    </g>
  </g>

  <!-- slave 1 -->
  <g>
    <rect x="384" y="94" width="228" height="146" rx="12" fill="#161A20" opacity="0.18"/>
    <rect x="380" y="90" width="228" height="146" rx="12" fill="#22262E"/>
    <rect x="387" y="97" width="214" height="132" rx="8" fill="url(#green)"/>
    <rect x="387" y="97" width="214" height="60" rx="8" fill="url(#gloss)"/>
    <text x="494" y="158" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif"
          font-size="19" font-weight="600" fill="#ffffff">SLAVE</text>
    <text x="494" y="181" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif"
          font-size="13" fill="#DFF3E9">its own apps and files</text>
    <rect x="476" y="236" width="36" height="14" fill="#22262E"/>
    <rect x="450" y="250" width="88" height="8" rx="4" fill="#22262E"/>
    <text x="494" y="282" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif"
          font-size="13.5" font-weight="600" fill="#2E3542">LAB-UBUNTU · Linux</text>
  </g>

  <!-- slave 2 -->
  <g>
    <rect x="664" y="94" width="228" height="146" rx="12" fill="#161A20" opacity="0.18"/>
    <rect x="660" y="90" width="228" height="146" rx="12" fill="#22262E"/>
    <rect x="667" y="97" width="214" height="132" rx="8" fill="url(#green)"/>
    <rect x="667" y="97" width="214" height="60" rx="8" fill="url(#gloss)"/>
    <text x="774" y="158" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif"
          font-size="19" font-weight="600" fill="#ffffff">SLAVE</text>
    <text x="774" y="181" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif"
          font-size="13" fill="#DFF3E9">no keyboard of its own</text>
    <rect x="756" y="236" width="36" height="14" fill="#22262E"/>
    <rect x="730" y="250" width="88" height="8" rx="4" fill="#22262E"/>
    <text x="774" y="282" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif"
          font-size="13.5" font-weight="600" fill="#2E3542">BUILD-SERVER · Windows</text>
  </g>

  <!-- the pointer travelling from the master screen to the far slave -->
  <path d="M250,118 C330,54 420,54 498,116" fill="none" stroke="#FF8C00" stroke-width="2.5"
        stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <path d="M560,118 C640,54 720,54 798,116" fill="none" stroke="#FF8C00" stroke-width="2.5"
        stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <g transform="translate(243 110) scale(1.25)" fill="#ffffff" stroke="#22262E" stroke-width="1.2">
    <path d="M0,0 L0,15 L4,11.5 L6.5,17 L9,15.8 L6.5,10.6 L11,10.4 Z"/>
  </g>
  <g transform="translate(791 110) scale(1.25)" fill="#ffffff" stroke="#22262E" stroke-width="1.2">
    <path d="M0,0 L0,15 L4,11.5 L6.5,17 L9,15.8 L6.5,10.6 L11,10.4 Z"/>
  </g>

  <text x="470" y="400" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="14" fill="#5A6472">Same local network · no cables, no KVM switch · the keyboard follows the pointer</text>
  <text x="470" y="424" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif"
        font-size="14" fill="#5A6472">Each slave keeps its own screens, applications and files — only input is shared</text>
</svg>
