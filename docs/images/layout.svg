<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img"
     aria-label="All screens of the master and of every slave form one layout space; each slave gets an offset in it">
  <defs>
    <linearGradient id="lblue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B97EE"/><stop offset="1" stop-color="#2654A8"/>
    </linearGradient>
    <linearGradient id="lgreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4CCB92"/><stop offset="1" stop-color="#1A7C54"/>
    </linearGradient>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5567"/>
    </marker>
  </defs>

  <rect width="940" height="440" fill="#ffffff"/>
  <text x="20" y="28" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="16" font-weight="600"
        fill="#2E3542">Layout space: the master's monitors and every connected slave's screens, side by side</text>

  <!-- how far the slave sits from the master's origin -->
  <path d="M302,74 L566,74" stroke="#4A5567" stroke-width="1.6" fill="none" marker-end="url(#tip)"/>
  <text x="434" y="66" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13"
        fill="#4A5567">offset (2560, 0)</text>

  <!-- master monitor 2 (left) -->
  <rect x="100" y="128" width="202" height="113" rx="9" fill="#22262E"/>
  <rect x="106" y="134" width="190" height="101" rx="6" fill="url(#lblue)"/>
  <text x="201" y="180" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13"
        font-weight="600" fill="#ffffff">MASTER 2</text>
  <text x="201" y="199" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5"
        fill="#E6EEFB">1920 × 1080</text>

  <!-- master monitor 1 (primary) -->
  <rect x="302" y="90" width="269" height="151" rx="9" fill="#22262E"/>
  <rect x="308" y="96" width="257" height="139" rx="6" fill="url(#lblue)"/>
  <text x="436" y="156" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="14"
        font-weight="600" fill="#ffffff">MASTER 1</text>
  <text x="436" y="176" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5"
        fill="#E6EEFB">2560 × 1440 · primary</text>

  <!-- slave: LAB-UBUNTU -->
  <rect x="571" y="90" width="269" height="151" rx="9" fill="#22262E"/>
  <rect x="577" y="96" width="257" height="139" rx="6" fill="url(#lgreen)"/>
  <text x="705" y="150" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="14"
        font-weight="600" fill="#ffffff">LAB-UBUNTU</text>
  <text x="705" y="170" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5"
        fill="#DFF3E9">2560 × 1440</text>
  <text x="705" y="188" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5"
        fill="#DFF3E9">its (0, 0) = layout (2560, 0)</text>

  <!-- slave: BUILD-SERVER -->
  <rect x="302" y="241" width="202" height="113" rx="9" fill="#22262E"/>
  <rect x="308" y="247" width="190" height="101" rx="6" fill="url(#lgreen)"/>
  <text x="403" y="292" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13"
        font-weight="600" fill="#ffffff">BUILD-SERVER</text>
  <text x="403" y="311" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5"
        fill="#DFF3E9">1920 × 1080</text>
  <text x="403" y="329" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5"
        fill="#DFF3E9">offset (0, 1440)</text>

  <!-- origin marker -->
  <g stroke="#2E3542" stroke-width="1.4">
    <path d="M294,90 L310,90"/><path d="M302,82 L302,98"/>
  </g>
  <text x="296" y="78" text-anchor="end" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12"
        fill="#2E3542">(0, 0)</text>

  <!-- the touching edge and the pointer crossing it -->
  <path d="M571,96 L571,235" stroke="#FF8C00" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(578 150) scale(1.3)" fill="#ffffff" stroke="#22262E" stroke-width="1.2">
    <path d="M0,0 L0,15 L4,11.5 L6.5,17 L9,15.8 L6.5,10.6 L11,10.4 Z"/>
  </g>
  <path d="M520,128 L566,128" stroke="#FF8C00" stroke-width="2.5" stroke-dasharray="6 5"/>

  <text x="705" y="264" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13"
        fill="#B35A00">touching edge: the pointer crosses here</text>

  <text x="20" y="392" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13.5" fill="#5A6472">
    Each slave is placed with an offset, by dragging it in the arrangement window — exactly like the Windows display settings.
  </text>
  <text x="20" y="414" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13.5" fill="#5A6472">
    The master sends every slave its own offset, and the slave converts: local position = layout position − offset.
  </text>
</svg>
